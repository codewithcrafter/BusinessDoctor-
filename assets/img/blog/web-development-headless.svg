<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#071224; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061326" />
      <stop offset="50%" stop-color="#0A1D36" />
      <stop offset="100%" stop-color="#071224" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(15, 34, 64, 0.85)" />
      <stop offset="100%" stop-color="rgba(8, 20, 39, 0.95)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background & Grid -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />
  <line x1='40' y1='0' x2='40' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='100' y1='0' x2='100' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='160' y1='0' x2='160' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='220' y1='0' x2='220' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='280' y1='0' x2='280' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='340' y1='0' x2='340' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='400' y1='0' x2='400' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='460' y1='0' x2='460' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='520' y1='0' x2='520' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='580' y1='0' x2='580' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='640' y1='0' x2='640' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='700' y1='0' x2='700' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='760' y1='0' x2='760' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='820' y1='0' x2='820' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='880' y1='0' x2='880' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='940' y1='0' x2='940' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='1000' y1='0' x2='1000' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='1060' y1='0' x2='1060' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='1120' y1='0' x2='1120' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='1180' y1='0' x2='1180' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='1240' y1='0' x2='1240' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='40' x2='1280' y2='40' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='100' x2='1280' y2='100' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='160' x2='1280' y2='160' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='220' x2='1280' y2='220' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='280' x2='1280' y2='280' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='340' x2='1280' y2='340' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='400' x2='1280' y2='400' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='460' x2='1280' y2='460' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='520' x2='1280' y2='520' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='580' x2='1280' y2='580' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='640' x2='1280' y2='640' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='700' x2='1280' y2='700' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' />

  <!-- Header Category & Badge -->
  <rect x="60" y="50" width="340" height="34" rx="17" fill="rgba(6, 181, 249, 0.12)" stroke="#06B5F9" stroke-width="1" />
  <circle cx="78" cy="67" r="5" fill="#06B5F9" filter="url(#glow)" />
  <text x="94" y="72" fill="#0099DB" font-size="12" font-weight="700" letter-spacing="1.5">WEB DEVELOPMENT &amp; ARCHITECTURE</text>

  <!-- Placeholder Disclaimer Pill -->
  <rect x="880" y="50" width="340" height="34" rx="6" fill="rgba(244, 63, 94, 0.12)" stroke="rgba(244, 63, 94, 0.35)" stroke-width="1" />
  <text x="1050" y="72" fill="#FDA4AF" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.8">ILLUSTRATIVE PLACEHOLDER — ARCHITECTURAL SCHEMATIC</text>

  <!-- Titles -->
  <text x="60" y="130" fill="#FFFFFF" font-size="28" font-weight="800" letter-spacing="-0.5">Decoupled Headless Engineering vs. Legacy Monolithic Infrastructure</text>
  <text x="60" y="165" fill="#94A3B8" font-size="15" font-weight="500">Architectural comparison between modern decoupled SSR frontends with edge delivery and legacy monoliths.</text>

  <!-- Main Diagram Canvas Box -->
  <rect x="60" y="200" width="1160" height="460" rx="12" fill="url(#cardGrad)" stroke="rgba(6, 181, 249, 0.25)" stroke-width="1.5" />
  
    <!-- Two Column Layout: Monolith vs Headless -->
  <!-- Left Side: Legacy Monolith -->
  <rect x="100" y="240" width="510" height="380" rx="10" fill="rgba(239, 68, 68, 0.05)" stroke="rgba(239, 68, 68, 0.3)" stroke-width="1.5" />
  <rect x="120" y="260" width="180" height="28" rx="14" fill="rgba(239, 68, 68, 0.2)" />
  <text x="210" y="279" fill="#FCA5A5" font-size="12" font-weight="700" text-anchor="middle">LEGACY MONOLITH (COUPLED)</text>

  <rect x="130" y="310" width="450" height="60" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.1)" />
  <text x="150" y="338" fill="#FFFFFF" font-size="13" font-weight="700">Coupled Presentation &amp; Business Logic</text>
  <text x="150" y="358" fill="#94A3B8" font-size="11">Heavy PHP/DB rendering on single compute server</text>

  <rect x="130" y="385" width="450" height="60" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.1)" />
  <text x="150" y="413" fill="#FFFFFF" font-size="13" font-weight="700">Render-Blocking JavaScript &amp; CSS</text>
  <text x="150" y="433" fill="#94A3B8" font-size="11">Plugins injecting 2.8MB+ unminified assets</text>

  <rect x="130" y="460" width="450" height="60" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.1)" />
  <text x="150" y="488" fill="#FFFFFF" font-size="13" font-weight="700">Database Bottleneck on Traffic Surges</text>
  <text x="150" y="508" fill="#94A3B8" font-size="11">Connection pool exhaustion; high Time-to-First-Byte</text>

  <text x="355" y="580" fill="#EF4444" font-size="16" font-weight="800" text-anchor="middle">Average TTFB: 1,840ms | CrUX Fail</text>

  <!-- Right Side: Decoupled Headless Edge -->
  <rect x="670" y="240" width="510" height="380" rx="10" fill="rgba(6, 181, 249, 0.05)" stroke="rgba(6, 181, 249, 0.4)" stroke-width="1.5" />
  <rect x="690" y="260" width="220" height="28" rx="14" fill="rgba(6, 181, 249, 0.2)" />
  <text x="800" y="279" fill="#0099DB" font-size="12" font-weight="700" text-anchor="middle">DECOUPLED EDGE ARCHITECTURE</text>

  <rect x="700" y="310" width="450" height="60" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(6, 181, 249, 0.25)" />
  <text x="720" y="338" fill="#0099DB" font-size="13" font-weight="700">Static HTML Pre-rendered at Global Edge</text>
  <text x="720" y="358" fill="#94A3B8" font-size="11">Cloudflare / Fastly CDN nodes serving cached responses</text>

  <rect x="700" y="385" width="450" height="60" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(6, 181, 249, 0.25)" />
  <text x="720" y="413" fill="#0099DB" font-size="13" font-weight="700">Zero-Dependency Lightweight Client JS</text>
  <text x="720" y="433" fill="#94A3B8" font-size="11">Vanilla JS / Alpine; sub-30KB compressed payloads</text>

  <rect x="700" y="460" width="450" height="60" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(6, 181, 249, 0.25)" />
  <text x="720" y="488" fill="#0099DB" font-size="13" font-weight="700">Dedicated Headless CMS API Layer</text>
  <text x="720" y="508" fill="#94A3B8" font-size="11">Read replicas &amp; Redis cache shield primary database</text>

  <text x="925" y="580" fill="#10B981" font-size="16" font-weight="800" text-anchor="middle">Average TTFB: 85ms | 100/100 Core Web Vitals</text>
</svg>