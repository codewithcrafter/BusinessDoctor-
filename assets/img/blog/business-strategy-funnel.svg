<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#071224; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061326" />
      <stop offset="50%" stop-color="#0A1D36" />
      <stop offset="100%" stop-color="#071224" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(15, 34, 64, 0.85)" />
      <stop offset="100%" stop-color="rgba(8, 20, 39, 0.95)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background & Grid -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />
  <line x1='40' y1='0' x2='40' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='100' y1='0' x2='100' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='160' y1='0' x2='160' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='220' y1='0' x2='220' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='280' y1='0' x2='280' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='340' y1='0' x2='340' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='400' y1='0' x2='400' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='460' y1='0' x2='460' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='520' y1='0' x2='520' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='580' y1='0' x2='580' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='640' y1='0' x2='640' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='700' y1='0' x2='700' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='760' y1='0' x2='760' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='820' y1='0' x2='820' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='880' y1='0' x2='880' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='940' y1='0' x2='940' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='1000' y1='0' x2='1000' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='1060' y1='0' x2='1060' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='1120' y1='0' x2='1120' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='1180' y1='0' x2='1180' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='1240' y1='0' x2='1240' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='40' x2='1280' y2='40' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='100' x2='1280' y2='100' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='160' x2='1280' y2='160' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='220' x2='1280' y2='220' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='280' x2='1280' y2='280' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='340' x2='1280' y2='340' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='400' x2='1280' y2='400' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='460' x2='1280' y2='460' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='520' x2='1280' y2='520' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='580' x2='1280' y2='580' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='640' x2='1280' y2='640' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='700' x2='1280' y2='700' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' />

  <!-- Header Category & Badge -->
  <rect x="60" y="50" width="340" height="34" rx="17" fill="rgba(6, 181, 249, 0.12)" stroke="#10B981" stroke-width="1" />
  <circle cx="78" cy="67" r="5" fill="#10B981" filter="url(#glow)" />
  <text x="94" y="72" fill="#34D399" font-size="12" font-weight="700" letter-spacing="1.5">BUSINESS STRATEGY &amp; UNIT ECONOMICS</text>

  <!-- Placeholder Disclaimer Pill -->
  <rect x="880" y="50" width="340" height="34" rx="6" fill="rgba(244, 63, 94, 0.12)" stroke="rgba(244, 63, 94, 0.35)" stroke-width="1" />
  <text x="1050" y="72" fill="#FDA4AF" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.8">ILLUSTRATIVE PLACEHOLDER — ARCHITECTURAL SCHEMATIC</text>

  <!-- Titles -->
  <text x="60" y="130" fill="#FFFFFF" font-size="28" font-weight="800" letter-spacing="-0.5">Enterprise LTV-to-CAC Ratio &amp; Conversion Yield Architecture</text>
  <text x="60" y="165" fill="#94A3B8" font-size="15" font-weight="500">Quantitative modeling demonstrating how sub-second site speed and high-intent UI eliminate CAC inflation.</text>

  <!-- Main Diagram Canvas Box -->
  <rect x="60" y="200" width="1160" height="460" rx="12" fill="url(#cardGrad)" stroke="rgba(6, 181, 249, 0.25)" stroke-width="1.5" />
  
    <!-- Chart & Metrics Layout -->
  <!-- Left Chart Box -->
  <rect x="100" y="240" width="560" height="380" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#10B981" stroke-width="1.5" />
  <text x="380" y="275" fill="#34D399" font-size="15" font-weight="700" text-anchor="middle">CONVERSION YIELD CURVE VS PAGE LOAD TIME</text>

  <!-- Coordinate Axes -->
  <line x1="160" y1="550" x2="600" y2="550" stroke="#94A3B8" stroke-width="2" />
  <line x1="160" y1="550" x2="160" y2="310" stroke="#94A3B8" stroke-width="2" />
  <text x="600" y="575" fill="#94A3B8" font-size="11" text-anchor="end">Page Load Speed (Seconds) &rarr;</text>
  <text x="140" y="315" fill="#94A3B8" font-size="11" text-anchor="end">&uarr; Conversion Rate (%)</text>

  <!-- Curve: High at 0.5s, dropping sharply after 2.0s -->
  <path d="M 180 340 Q 280 360, 360 440 T 560 535" fill="none" stroke="#10B981" stroke-width="3" />
  <circle cx="200" cy="345" r="5" fill="#34D399" filter="url(#glow)" />
  <text x="215" y="340" fill="#34D399" font-size="12" font-weight="700">0.8s: 4.8% Conv.</text>

  <circle cx="360" cy="440" r="5" fill="#F59E0B" />
  <text x="380" y="435" fill="#FCD34D" font-size="12" font-weight="700">2.5s: 2.1% Conv.</text>

  <circle cx="520" cy="525" r="5" fill="#EF4444" />
  <text x="525" y="515" fill="#FCA5A5" font-size="12" font-weight="700">4.5s: 0.7% Conv.</text>

  <!-- Right Unit Economics Box -->
  <rect x="700" y="240" width="480" height="380" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
  <text x="940" y="275" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">COMMERCIAL RETURN METRICS</text>

  <rect x="730" y="310" width="420" height="70" rx="6" fill="rgba(16, 185, 129, 0.12)" stroke="#10B981" />
  <text x="750" y="338" fill="#34D399" font-size="13" font-weight="700">Effective Customer Acquisition Cost (CAC)</text>
  <text x="750" y="365" fill="#FFFFFF" font-size="20" font-weight="800">- 52.4% Reduction</text>
  <text x="1120" y="365" fill="#34D399" font-size="12" text-anchor="end">Engineered Funnel Yield</text>

  <rect x="730" y="395" width="420" height="70" rx="6" fill="rgba(59, 130, 246, 0.12)" stroke="#3B82F6" />
  <text x="750" y="423" fill="#60A5FA" font-size="13" font-weight="700">LTV to CAC Ratio Multiple</text>
  <text x="750" y="450" fill="#FFFFFF" font-size="20" font-weight="800">4.8x Enterprise Multiple</text>
  <text x="1120" y="450" fill="#60A5FA" font-size="12" text-anchor="end">Top Quartile Benchmark</text>

  <rect x="730" y="480" width="420" height="70" rx="6" fill="rgba(245, 158, 11, 0.12)" stroke="#F59E0B" />
  <text x="750" y="508" fill="#FCD34D" font-size="13" font-weight="700">Annual Marketing Budget Preservation</text>
  <text x="750" y="535" fill="#FFFFFF" font-size="20" font-weight="800">$140,000+ Recovered</text>
  <text x="1120" y="535" fill="#FCD34D" font-size="12" text-anchor="end">Eliminated Ad Waste</text>

  <text x="940" y="590" fill="#10B981" font-size="13" font-weight="700" text-anchor="middle">Technology Is The Primary Multiplier of Marketing Capital</text>
</svg>