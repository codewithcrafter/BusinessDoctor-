<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#071224; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061326" />
      <stop offset="50%" stop-color="#0A1D36" />
      <stop offset="100%" stop-color="#071224" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(15, 34, 64, 0.85)" />
      <stop offset="100%" stop-color="rgba(8, 20, 39, 0.95)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background & Grid -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />
  <line x1='40' y1='0' x2='40' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='100' y1='0' x2='100' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='160' y1='0' x2='160' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='220' y1='0' x2='220' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='280' y1='0' x2='280' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='340' y1='0' x2='340' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='400' y1='0' x2='400' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='460' y1='0' x2='460' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='520' y1='0' x2='520' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='580' y1='0' x2='580' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='640' y1='0' x2='640' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='700' y1='0' x2='700' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='760' y1='0' x2='760' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='820' y1='0' x2='820' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='880' y1='0' x2='880' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='940' y1='0' x2='940' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='1000' y1='0' x2='1000' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='1060' y1='0' x2='1060' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='1120' y1='0' x2='1120' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='1180' y1='0' x2='1180' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='1240' y1='0' x2='1240' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='40' x2='1280' y2='40' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='100' x2='1280' y2='100' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='160' x2='1280' y2='160' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='220' x2='1280' y2='220' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='280' x2='1280' y2='280' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='340' x2='1280' y2='340' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='400' x2='1280' y2='400' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='460' x2='1280' y2='460' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='520' x2='1280' y2='520' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='580' x2='1280' y2='580' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='640' x2='1280' y2='640' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='700' x2='1280' y2='700' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' />

  <!-- Header Category & Badge -->
  <rect x="60" y="50" width="340" height="34" rx="17" fill="rgba(6, 181, 249, 0.12)" stroke="#EC4899" stroke-width="1" />
  <circle cx="78" cy="67" r="5" fill="#EC4899" filter="url(#glow)" />
  <text x="94" y="72" fill="#F472B6" font-size="12" font-weight="700" letter-spacing="1.5">UI/UX &amp; DESIGN SYSTEM ARCHITECTURE</text>

  <!-- Placeholder Disclaimer Pill -->
  <rect x="880" y="50" width="340" height="34" rx="6" fill="rgba(244, 63, 94, 0.12)" stroke="rgba(244, 63, 94, 0.35)" stroke-width="1" />
  <text x="1050" y="72" fill="#FDA4AF" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.8">ILLUSTRATIVE PLACEHOLDER — ARCHITECTURAL SCHEMATIC</text>

  <!-- Titles -->
  <text x="60" y="130" fill="#FFFFFF" font-size="28" font-weight="800" letter-spacing="-0.5">Design Token Architecture &amp; Component Hierarchy</text>
  <text x="60" y="165" fill="#94A3B8" font-size="15" font-weight="500">Unified design token propagation from Figma variables to CSS custom properties and atomic UI components.</text>

  <!-- Main Diagram Canvas Box -->
  <rect x="60" y="200" width="1160" height="460" rx="12" fill="url(#cardGrad)" stroke="rgba(6, 181, 249, 0.25)" stroke-width="1.5" />
  
    <!-- Column 1: Primitive Tokens -->
  <rect x="100" y="240" width="240" height="380" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#EC4899" stroke-width="1.5" />
  <text x="220" y="275" fill="#F472B6" font-size="15" font-weight="700" text-anchor="middle">PRIMITIVE TOKENS</text>
  
  <rect x="120" y="310" width="200" height="40" rx="4" fill="#071224" stroke="rgba(255,255,255,0.1)" />
  <circle cx="140" cy="330" r="8" fill="#06B5F9" />
  <text x="160" y="335" fill="#FFFFFF" font-size="12" font-family="monospace">color-cyan: #06B5F9</text>

  <rect x="120" y="365" width="200" height="40" rx="4" fill="#071224" stroke="rgba(255,255,255,0.1)" />
  <circle cx="140" cy="385" r="8" fill="#061326" stroke="#94A3B8" />
  <text x="160" y="390" fill="#FFFFFF" font-size="12" font-family="monospace">color-navy: #061326</text>

  <rect x="120" y="420" width="200" height="40" rx="4" fill="#071224" stroke="rgba(255,255,255,0.1)" />
  <text x="135" y="445" fill="#0099DB" font-size="12" font-family="monospace">space-md: 1.5rem</text>

  <rect x="120" y="475" width="200" height="40" rx="4" fill="#071224" stroke="rgba(255,255,255,0.1)" />
  <text x="135" y="500" fill="#F472B6" font-size="12" font-family="monospace">radius-lg: 16px</text>

  <text x="220" y="580" fill="#94A3B8" font-size="12" text-anchor="middle">Synchronized via Style Dictionary</text>

  <!-- Arrow -->
  <path d="M 340 430 L 410 430" stroke="#EC4899" stroke-width="2" />
  <polygon points="410,426 420,430 410,434" fill="#EC4899" />

  <!-- Column 2: Semantic Tokens -->
  <rect x="420" y="240" width="260" height="380" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#A855F7" stroke-width="1.5" />
  <text x="550" y="275" fill="#C084FC" font-size="15" font-weight="700" text-anchor="middle">SEMANTIC MAPPINGS</text>

  <rect x="440" y="310" width="220" height="50" rx="4" fill="rgba(168, 85, 247, 0.15)" stroke="#A855F7" />
  <text x="455" y="333" fill="#FFFFFF" font-size="12" font-weight="700">--color-primary-accent</text>
  <text x="455" y="350" fill="#C084FC" font-size="11" font-family="monospace">&rarr; var(--color-cyan)</text>

  <rect x="440" y="375" width="220" height="50" rx="4" fill="rgba(168, 85, 247, 0.15)" stroke="#A855F7" />
  <text x="455" y="398" fill="#FFFFFF" font-size="12" font-weight="700">--color-card-background</text>
  <text x="455" y="415" fill="#C084FC" font-size="11" font-family="monospace">&rarr; var(--color-dark-surface)</text>

  <rect x="440" y="440" width="220" height="50" rx="4" fill="rgba(168, 85, 247, 0.15)" stroke="#A855F7" />
  <text x="455" y="463" fill="#FFFFFF" font-size="12" font-weight="700">--interactive-focus-ring</text>
  <text x="455" y="480" fill="#C084FC" font-size="11" font-family="monospace">&rarr; 2px solid #06B5F9</text>

  <text x="550" y="580" fill="#94A3B8" font-size="12" text-anchor="middle">WCAG 2.1 AA Contrast Ratio: 7.2:1</text>

  <!-- Arrow -->
  <path d="M 680 430 L 750 430" stroke="#A855F7" stroke-width="2" />
  <polygon points="750,426 760,430 750,434" fill="#A855F7" />

  <!-- Column 3: Component Components & UI Previews -->
  <rect x="760" y="240" width="420" height="380" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#06B5F9" stroke-width="1.5" />
  <text x="970" y="275" fill="#0099DB" font-size="15" font-weight="700" text-anchor="middle">ACCESSIBLE COMPONENT SYSTEM</text>

  <!-- Card preview -->
  <rect x="790" y="305" width="360" height="95" rx="8" fill="#061326" stroke="rgba(6, 181, 249, 0.3)" />
  <rect x="805" y="320" width="70" height="65" rx="4" fill="#0A1D36" />
  <circle cx="840" cy="352" r="14" fill="#06B5F9" />
  <text x="890" y="342" fill="#FFFFFF" font-size="14" font-weight="700">Enterprise Service Card</text>
  <text x="890" y="362" fill="#94A3B8" font-size="11">Consistent margins, padding, and state</text>

  <!-- Button preview -->
  <rect x="790" y="420" width="170" height="44" rx="6" fill="#06B5F9" />
  <text x="875" y="447" fill="#061326" font-size="13" font-weight="700" text-anchor="middle">Primary Action</text>

  <rect x="980" y="420" width="170" height="44" rx="6" fill="transparent" stroke="#06B5F9" stroke-width="1.5" />
  <text x="1065" y="447" fill="#0099DB" font-size="13" font-weight="700" text-anchor="middle">Secondary Outline</text>

  <!-- Input field -->
  <rect x="790" y="485" width="360" height="44" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)" />
  <text x="810" y="512" fill="#94A3B8" font-size="12">Frictionless form input with native validation...</text>

  <text x="970" y="580" fill="#10B981" font-size="13" font-weight="700" text-anchor="middle">Figma &amp; Production Code Perfectly In Sync</text>
</svg>