<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#071224; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061326" />
      <stop offset="50%" stop-color="#0A1D36" />
      <stop offset="100%" stop-color="#071224" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(15, 34, 64, 0.85)" />
      <stop offset="100%" stop-color="rgba(8, 20, 39, 0.95)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background & Grid -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />
  <line x1='40' y1='0' x2='40' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='100' y1='0' x2='100' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='160' y1='0' x2='160' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='220' y1='0' x2='220' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='280' y1='0' x2='280' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='340' y1='0' x2='340' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='400' y1='0' x2='400' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='460' y1='0' x2='460' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='520' y1='0' x2='520' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='580' y1='0' x2='580' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='640' y1='0' x2='640' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='700' y1='0' x2='700' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='760' y1='0' x2='760' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='820' y1='0' x2='820' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='880' y1='0' x2='880' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='940' y1='0' x2='940' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='1000' y1='0' x2='1000' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='1060' y1='0' x2='1060' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='1120' y1='0' x2='1120' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='1180' y1='0' x2='1180' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='1240' y1='0' x2='1240' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='40' x2='1280' y2='40' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='100' x2='1280' y2='100' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='160' x2='1280' y2='160' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='220' x2='1280' y2='220' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='280' x2='1280' y2='280' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='340' x2='1280' y2='340' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='400' x2='1280' y2='400' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='460' x2='1280' y2='460' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='520' x2='1280' y2='520' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='580' x2='1280' y2='580' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='640' x2='1280' y2='640' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='700' x2='1280' y2='700' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' />

  <!-- Header Category & Badge -->
  <rect x="60" y="50" width="340" height="34" rx="17" fill="rgba(6, 181, 249, 0.12)" stroke="#8B5CF6" stroke-width="1" />
  <circle cx="78" cy="67" r="5" fill="#8B5CF6" filter="url(#glow)" />
  <text x="94" y="72" fill="#A78BFA" font-size="12" font-weight="700" letter-spacing="1.5">AI &amp; AUTOMATION ARCHITECTURE</text>

  <!-- Placeholder Disclaimer Pill -->
  <rect x="880" y="50" width="340" height="34" rx="6" fill="rgba(244, 63, 94, 0.12)" stroke="rgba(244, 63, 94, 0.35)" stroke-width="1" />
  <text x="1050" y="72" fill="#FDA4AF" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.8">ILLUSTRATIVE PLACEHOLDER — ARCHITECTURAL SCHEMATIC</text>

  <!-- Titles -->
  <text x="60" y="130" fill="#FFFFFF" font-size="28" font-weight="800" letter-spacing="-0.5">Agentic Workflow Pipeline &amp; LLM Inference Orchestration</text>
  <text x="60" y="165" fill="#94A3B8" font-size="15" font-weight="500">High-throughput enterprise AI architecture: prompt gateways, vector embeddings, fine-tuned model routing, and automated audit checks.</text>

  <!-- Main Diagram Canvas Box -->
  <rect x="60" y="200" width="1160" height="460" rx="12" fill="url(#cardGrad)" stroke="rgba(6, 181, 249, 0.25)" stroke-width="1.5" />
  
    <!-- Pipeline Steps -->
  <!-- Step 1: Input & Ingestion -->
  <rect x="100" y="240" width="220" height="150" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#8B5CF6" stroke-width="1.5" />
  <text x="210" y="275" fill="#A78BFA" font-size="14" font-weight="700" text-anchor="middle">INGESTION &amp; TOKENIZATION</text>
  <text x="210" y="305" fill="#94A3B8" font-size="12" text-anchor="middle">API Gateways / Webhooks</text>
  <text x="210" y="330" fill="#CBD5E1" font-size="11" text-anchor="middle">Semantic Chunking &amp; Sanitization</text>
  <text x="210" y="355" fill="#34D399" font-size="11" font-family="monospace" text-anchor="middle">Latency: ~12ms</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 320 315 L 370 315" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrow)" />
  <polygon points="370,311 380,315 370,319" fill="#8B5CF6" />

  <!-- Step 2: Vector DB & Retrieval -->
  <rect x="380" y="240" width="240" height="150" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#06B5F9" stroke-width="1.5" />
  <text x="500" y="275" fill="#0099DB" font-size="14" font-weight="700" text-anchor="middle">HYBRID RETRIEVAL (RAG)</text>
  <text x="500" y="305" fill="#94A3B8" font-size="12" text-anchor="middle">HNSW Vector Index + BM25</text>
  <text x="500" y="330" fill="#CBD5E1" font-size="11" text-anchor="middle">Contextual Re-ranking Layer</text>
  <text x="500" y="355" fill="#34D399" font-size="11" font-family="monospace" text-anchor="middle">Recall: 99.4%</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 620 315 L 670 315" stroke="#06B5F9" stroke-width="2" />
  <polygon points="670,311 680,315 670,319" fill="#06B5F9" />

  <!-- Step 3: LLM Inference Router -->
  <rect x="680" y="240" width="240" height="150" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#F59E0B" stroke-width="1.5" />
  <text x="800" y="275" fill="#FCD34D" font-size="14" font-weight="700" text-anchor="middle">MODEL ORCHESTRATION</text>
  <text x="800" y="305" fill="#94A3B8" font-size="12" text-anchor="middle">Multi-Model Dynamic Routing</text>
  <text x="800" y="330" fill="#CBD5E1" font-size="11" text-anchor="middle">Fallback &amp; Semantic Caching</text>
  <text x="800" y="355" fill="#34D399" font-size="11" font-family="monospace" text-anchor="middle">Cache Hit: 42%</text>

  <!-- Arrow 3 -> 4 -->
  <path d="M 920 315 L 970 315" stroke="#F59E0B" stroke-width="2" />
  <polygon points="970,311 980,315 970,319" fill="#F59E0B" />

  <!-- Step 4: Guardrails & Action Execution -->
  <rect x="980" y="240" width="200" height="150" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#10B981" stroke-width="1.5" />
  <text x="1080" y="275" fill="#6EE7B7" font-size="14" font-weight="700" text-anchor="middle">AGENTIC ACTIONS</text>
  <text x="1080" y="305" fill="#94A3B8" font-size="12" text-anchor="middle">Automated Webhook Callbacks</text>
  <text x="1080" y="330" fill="#CBD5E1" font-size="11" text-anchor="middle">Output Safety Verification</text>
  <text x="1080" y="355" fill="#34D399" font-size="11" font-family="monospace" text-anchor="middle">Status: Confirmed</text>

  <!-- Telemetry Bar -->
  <rect x="100" y="430" width="1080" height="190" rx="8" fill="rgba(10, 15, 30, 0.7)" stroke="rgba(255,255,255,0.08)" />
  <text x="130" y="470" fill="#FFFFFF" font-size="16" font-weight="700">Enterprise AI Metrics &amp; Telemetry Stream</text>
  <line x1="130" y1="485" x2="1150" y2="485" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  
  <text x="160" y="525" fill="#94A3B8" font-size="13">Median P95 Latency</text>
  <text x="160" y="560" fill="#0099DB" font-size="24" font-weight="800">142ms</text>
  <text x="160" y="590" fill="#34D399" font-size="12">&darr; 64% vs Traditional</text>

  <text x="440" y="525" fill="#94A3B8" font-size="13">Enterprise Token Throughput</text>
  <text x="440" y="560" fill="#A78BFA" font-size="24" font-weight="800">4,280 tok/s</text>
  <text x="440" y="590" fill="#34D399" font-size="12">&uarr; Auto-scaled across 8 nodes</text>

  <text x="740" y="525" fill="#94A3B8" font-size="13">Deterministic Accuracy</text>
  <text x="740" y="560" fill="#FCD34D" font-size="24" font-weight="800">99.85%</text>
  <text x="740" y="590" fill="#34D399" font-size="12">Passed automated compliance tests</text>

  <text x="1000" y="525" fill="#94A3B8" font-size="13">Cost Per 1k Queries</text>
  <text x="1000" y="560" fill="#34D399" font-size="24" font-weight="800">$0.0084</text>
  <text x="1000" y="590" fill="#34D399" font-size="12">&darr; 82% with semantic cache</text>
</svg>