<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#071224; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061326" />
      <stop offset="50%" stop-color="#0A1D36" />
      <stop offset="100%" stop-color="#071224" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(15, 34, 64, 0.85)" />
      <stop offset="100%" stop-color="rgba(8, 20, 39, 0.95)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background & Grid -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />
  <line x1='40' y1='0' x2='40' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='100' y1='0' x2='100' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='160' y1='0' x2='160' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='220' y1='0' x2='220' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='280' y1='0' x2='280' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='340' y1='0' x2='340' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='400' y1='0' x2='400' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='460' y1='0' x2='460' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='520' y1='0' x2='520' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='580' y1='0' x2='580' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='640' y1='0' x2='640' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='700' y1='0' x2='700' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='760' y1='0' x2='760' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='820' y1='0' x2='820' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='880' y1='0' x2='880' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='940' y1='0' x2='940' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='1000' y1='0' x2='1000' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='1060' y1='0' x2='1060' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='1120' y1='0' x2='1120' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='1180' y1='0' x2='1180' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='1240' y1='0' x2='1240' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='40' x2='1280' y2='40' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='100' x2='1280' y2='100' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='160' x2='1280' y2='160' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='220' x2='1280' y2='220' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='280' x2='1280' y2='280' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='340' x2='1280' y2='340' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='400' x2='1280' y2='400' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='460' x2='1280' y2='460' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='520' x2='1280' y2='520' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='580' x2='1280' y2='580' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='640' x2='1280' y2='640' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='700' x2='1280' y2='700' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' />

  <!-- Header Category & Badge -->
  <rect x="60" y="50" width="340" height="34" rx="17" fill="rgba(6, 181, 249, 0.12)" stroke="#06B6D4" stroke-width="1" />
  <circle cx="78" cy="67" r="5" fill="#06B6D4" filter="url(#glow)" />
  <text x="94" y="72" fill="#22D3EE" font-size="12" font-weight="700" letter-spacing="1.5">CLOUD COMPUTING &amp; INFRASTRUCTURE</text>

  <!-- Placeholder Disclaimer Pill -->
  <rect x="880" y="50" width="340" height="34" rx="6" fill="rgba(244, 63, 94, 0.12)" stroke="rgba(244, 63, 94, 0.35)" stroke-width="1" />
  <text x="1050" y="72" fill="#FDA4AF" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.8">ILLUSTRATIVE PLACEHOLDER — ARCHITECTURAL SCHEMATIC</text>

  <!-- Titles -->
  <text x="60" y="130" fill="#FFFFFF" font-size="28" font-weight="800" letter-spacing="-0.5">Global Distributed Edge Network &amp; Low-Latency Routing</text>
  <text x="60" y="165" fill="#94A3B8" font-size="15" font-weight="500">Global content delivery, distributed serverless compute workers, Redis edge caching, and automated failover.</text>

  <!-- Main Diagram Canvas Box -->
  <rect x="60" y="200" width="1160" height="460" rx="12" fill="url(#cardGrad)" stroke="rgba(6, 181, 249, 0.25)" stroke-width="1.5" />
  
    <!-- Global Map / Network Nodes -->
  <!-- Center Global Router -->
  <circle cx="640" cy="400" r="85" fill="rgba(6, 182, 212, 0.15)" stroke="#06B6D4" stroke-width="2" />
  <text x="640" y="395" fill="#FFFFFF" font-size="16" font-weight="800" text-anchor="middle">EDGE BACKBONE</text>
  <text x="640" y="415" fill="#22D3EE" font-size="12" font-family="monospace" text-anchor="middle">Anycast DNS Routing</text>
  <text x="640" y="435" fill="#34D399" font-size="11" text-anchor="middle">300+ Cities Worldwide</text>

  <!-- Edge Node 1: North America -->
  <rect x="120" y="250" width="220" height="110" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="#06B6D4" />
  <text x="230" y="280" fill="#22D3EE" font-size="14" font-weight="700" text-anchor="middle">US-EAST (VIRGINIA)</text>
  <text x="230" y="305" fill="#94A3B8" font-size="11" text-anchor="middle">Edge Compute + Redis Cache</text>
  <text x="230" y="330" fill="#34D399" font-size="13" font-weight="700" text-anchor="middle">Latency: 14ms</text>
  <line x1="340" y1="305" x2="560" y2="375" stroke="#06B6D4" stroke-width="2" stroke-dasharray="4" />

  <!-- Edge Node 2: Europe -->
  <rect x="940" y="250" width="220" height="110" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="#06B6D4" />
  <text x="1050" y="280" fill="#22D3EE" font-size="14" font-weight="700" text-anchor="middle">EU-CENTRAL (FRANKFURT)</text>
  <text x="1050" y="305" fill="#94A3B8" font-size="11" text-anchor="middle">Edge Compute + Redis Cache</text>
  <text x="1050" y="330" fill="#34D399" font-size="13" font-weight="700" text-anchor="middle">Latency: 18ms</text>
  <line x1="940" y1="305" x2="720" y2="375" stroke="#06B6D4" stroke-width="2" stroke-dasharray="4" />

  <!-- Edge Node 3: Asia Pacific -->
  <rect x="120" y="480" width="220" height="110" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="#06B6D4" />
  <text x="230" y="510" fill="#22D3EE" font-size="14" font-weight="700" text-anchor="middle">AP-SOUTHEAST (SINGAPORE)</text>
  <text x="230" y="535" fill="#94A3B8" font-size="11" text-anchor="middle">Edge Compute + Redis Cache</text>
  <text x="230" y="560" fill="#34D399" font-size="13" font-weight="700" text-anchor="middle">Latency: 22ms</text>
  <line x1="340" y1="535" x2="565" y2="435" stroke="#06B6D4" stroke-width="2" stroke-dasharray="4" />

  <!-- Edge Node 4: South America / India -->
  <rect x="940" y="480" width="220" height="110" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="#06B6D4" />
  <text x="1050" y="510" fill="#22D3EE" font-size="14" font-weight="700" text-anchor="middle">AP-SOUTH (MUMBAI)</text>
  <text x="1050" y="535" fill="#94A3B8" font-size="11" text-anchor="middle">Edge Compute + Redis Cache</text>
  <text x="1050" y="560" fill="#34D399" font-size="13" font-weight="700" text-anchor="middle">Latency: 19ms</text>
  <line x1="940" y1="535" x2="715" y2="435" stroke="#06B6D4" stroke-width="2" stroke-dasharray="4" />

  <!-- Status Bar -->
  <rect x="380" y="570" width="520" height="50" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" />
  <circle cx="410" cy="595" r="7" fill="#10B981" filter="url(#glow)" />
  <text x="430" y="600" fill="#6EE7B7" font-size="13" font-weight="700">99.999% High Availability | Zero Single Point of Failure</text>
</svg>