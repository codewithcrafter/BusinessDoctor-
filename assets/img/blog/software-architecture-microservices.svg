<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#071224; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061326" />
      <stop offset="50%" stop-color="#0A1D36" />
      <stop offset="100%" stop-color="#071224" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(15, 34, 64, 0.85)" />
      <stop offset="100%" stop-color="rgba(8, 20, 39, 0.95)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background & Grid -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />
  <line x1='40' y1='0' x2='40' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='100' y1='0' x2='100' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='160' y1='0' x2='160' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='220' y1='0' x2='220' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='280' y1='0' x2='280' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='340' y1='0' x2='340' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='400' y1='0' x2='400' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='460' y1='0' x2='460' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='520' y1='0' x2='520' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='580' y1='0' x2='580' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='640' y1='0' x2='640' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='700' y1='0' x2='700' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='760' y1='0' x2='760' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='820' y1='0' x2='820' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='880' y1='0' x2='880' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='940' y1='0' x2='940' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='1000' y1='0' x2='1000' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='1060' y1='0' x2='1060' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='1120' y1='0' x2='1120' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='1180' y1='0' x2='1180' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='1240' y1='0' x2='1240' y2='720' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='40' x2='1280' y2='40' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='100' x2='1280' y2='100' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='160' x2='1280' y2='160' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='220' x2='1280' y2='220' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='280' x2='1280' y2='280' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='340' x2='1280' y2='340' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='400' x2='1280' y2='400' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='460' x2='1280' y2='460' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='520' x2='1280' y2='520' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='580' x2='1280' y2='580' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='640' x2='1280' y2='640' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' /><line x1='0' y1='700' x2='1280' y2='700' stroke='rgba(6, 181, 249, 0.04)' stroke-width='1' />

  <!-- Header Category & Badge -->
  <rect x="60" y="50" width="340" height="34" rx="17" fill="rgba(6, 181, 249, 0.12)" stroke="#6366F1" stroke-width="1" />
  <circle cx="78" cy="67" r="5" fill="#6366F1" filter="url(#glow)" />
  <text x="94" y="72" fill="#818CF8" font-size="12" font-weight="700" letter-spacing="1.5">SOFTWARE ARCHITECTURE &amp; SCALABILITY</text>

  <!-- Placeholder Disclaimer Pill -->
  <rect x="880" y="50" width="340" height="34" rx="6" fill="rgba(244, 63, 94, 0.12)" stroke="rgba(244, 63, 94, 0.35)" stroke-width="1" />
  <text x="1050" y="72" fill="#FDA4AF" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.8">ILLUSTRATIVE PLACEHOLDER — ARCHITECTURAL SCHEMATIC</text>

  <!-- Titles -->
  <text x="60" y="130" fill="#FFFFFF" font-size="28" font-weight="800" letter-spacing="-0.5">Event-Driven Microservices &amp; Resilient Database Topology</text>
  <text x="60" y="165" fill="#94A3B8" font-size="15" font-weight="500">Decoupled domain boundaries, Kafka/RabbitMQ event queues, read-replicas, and zero-downtime blue/green deployment.</text>

  <!-- Main Diagram Canvas Box -->
  <rect x="60" y="200" width="1160" height="460" rx="12" fill="url(#cardGrad)" stroke="rgba(6, 181, 249, 0.25)" stroke-width="1.5" />
  
    <!-- Microservices Architecture Diagram -->
  <!-- API Gateway Top -->
  <rect x="420" y="240" width="440" height="60" rx="8" fill="rgba(99, 102, 241, 0.2)" stroke="#6366F1" stroke-width="1.5" />
  <text x="640" y="268" fill="#FFFFFF" font-size="15" font-weight="800" text-anchor="middle">ENTERPRISE API GATEWAY / REVERSE PROXY</text>
  <text x="640" y="288" fill="#818CF8" font-size="11" text-anchor="middle">mTLS Authentication &bull; Rate Limiting &bull; JWT Validation</text>

  <!-- Connectors from Gateway -->
  <line x1="490" y1="300" x2="270" y2="350" stroke="#6366F1" stroke-width="2" />
  <line x1="640" y1="300" x2="640" y2="350" stroke="#6366F1" stroke-width="2" />
  <line x1="790" y1="300" x2="1010" y2="350" stroke="#6366F1" stroke-width="2" />

  <!-- Service 1: Auth & User Service -->
  <rect x="160" y="350" width="220" height="110" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.15)" />
  <text x="270" y="380" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">IDENTITY SERVICE</text>
  <text x="270" y="405" fill="#94A3B8" font-size="11" text-anchor="middle">RBAC &amp; SSO OAuth 2.0</text>
  <rect x="185" y="420" width="170" height="24" rx="4" fill="rgba(99, 102, 241, 0.2)" />
  <text x="270" y="436" fill="#818CF8" font-size="10" font-family="monospace" text-anchor="middle">Postgres / Redis Token Cache</text>

  <!-- Service 2: Core Domain Service -->
  <rect x="530" y="350" width="220" height="110" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="#06B5F9" />
  <text x="640" y="380" fill="#0099DB" font-size="13" font-weight="700" text-anchor="middle">CORE DOMAIN ENGINE</text>
  <text x="640" y="405" fill="#94A3B8" font-size="11" text-anchor="middle">Business Logic &amp; Workflows</text>
  <rect x="555" y="420" width="170" height="24" rx="4" fill="rgba(6, 181, 249, 0.2)" />
  <text x="640" y="436" fill="#0099DB" font-size="10" font-family="monospace" text-anchor="middle">Read / Write Split Cluster</text>

  <!-- Service 3: Analytics & Notification -->
  <rect x="900" y="350" width="220" height="110" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.15)" />
  <text x="1010" y="380" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">TELEMETRY &amp; NOTIFY</text>
  <text x="1010" y="405" fill="#94A3B8" font-size="11" text-anchor="middle">Async Webhooks &amp; Mail</text>
  <rect x="925" y="420" width="170" height="24" rx="4" fill="rgba(245, 158, 11, 0.2)" />
  <text x="1010" y="436" fill="#FCD34D" font-size="10" font-family="monospace" text-anchor="middle">ClickHouse Timeseries</text>

  <!-- Event Bus Stream -->
  <rect x="160" y="495" width="960" height="55" rx="8" fill="rgba(10, 15, 30, 0.9)" stroke="#F59E0B" stroke-dasharray="6" />
  <text x="640" y="525" fill="#FCD34D" font-size="14" font-weight="700" text-anchor="middle">DISTRIBUTED EVENT LOG (APACHE KAFKA / RABBITMQ)</text>
  <text x="640" y="542" fill="#94A3B8" font-size="11" text-anchor="middle">Zero Data Loss &bull; At-Least-Once Delivery Semantics</text>

  <!-- Connectors to Bus -->
  <line x1="270" y1="460" x2="270" y2="495" stroke="#F59E0B" stroke-width="1.5" />
  <line x1="640" y1="460" x2="640" y2="495" stroke="#F59E0B" stroke-width="1.5" />
  <line x1="1010" y1="460" x2="1010" y2="495" stroke="#F59E0B" stroke-width="1.5" />

  <text x="640" y="605" fill="#10B981" font-size="14" font-weight="700" text-anchor="middle">Isolated Failure Domains &bull; Horizontal Scalability</text>
</svg>